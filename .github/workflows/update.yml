name: Update Brasileirão data

on:
  schedule:
    # Daily recovery and refresh of upcoming match-specific cron entries.
    - cron: "0 7 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: brasileirao-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh results and run audits
        run: python scripts/update.py

      - name: Schedule checks after upcoming match finishes
        run: python scripts/schedule_matches.py

      - name: Commit data when it changed
        id: commit
        run: |
          git add data/brasileirao_2026.json data/match_check_schedule.json
          if git diff --cached --quiet; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            if git diff --cached --quiet -- data/brasileirao_2026.json; then
              echo "data_changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "data_changed=true" >> "$GITHUB_OUTPUT"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh match schedule and Brasileirão results"
            git push
          fi

      - name: Configure GitHub Pages
        if: steps.commit.outputs.data_changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Package static site
        if: steps.commit.outputs.data_changed == 'true'
        run: |
          mkdir -p _site/data _site/assets
          cp index.html _site/index.html
          cp data/brasileirao_2026.json _site/data/
          cp assets/*.png _site/assets/

      - name: Upload Pages artifact
        if: steps.commit.outputs.data_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.data_changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
